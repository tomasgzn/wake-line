<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stackfall</title>
<meta name="description" content="A neon block-stacking arcade game with hold, ghost piece, and 7-bag randomizer." />
<style>
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --bg: #08080d;
    --cabinet: #101019;
    --panel: #16161f;
    --panel-edge: #26263a;
    --grid-line: #1c1c2b;
    --ink: #e8e8f4;
    --muted: #7e7e9a;
    --cyan: #22d3ee;
    --magenta: #f472b6;
    --amber: #fbbf24;
    --i: #22d3ee;
    --o: #fbbf24;
    --t: #c084fc;
    --s: #4ade80;
    --z: #fb7185;
    --j: #60a5fa;
    --l: #fb923c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, #16162a 0%, var(--bg) 60%),
      var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .cabinet {
    display: grid;
    grid-template-columns: auto auto;
    gap: 22px;
    align-items: start;
    background: linear-gradient(180deg, #13131f, #0c0c14);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 22px;
    box-shadow:
      0 0 0 1px rgba(34, 211, 238, 0.06),
      0 30px 80px -30px rgba(0, 0, 0, 0.9),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .stage { position: relative; }

  canvas#board {
    display: block;
    background: #0a0a12;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6);
    touch-action: none;
  }

  .brand {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 2px;
  }

  .brand h1 {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 3.4vw, 30px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand .tag {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rail {
    width: 176px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .box {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 12px;
  }

  .box h2 {
    margin: 0 0 8px;
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  canvas#next, canvas#hold {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
  }

  .stats { gap: 10px; display: flex; flex-direction: column; }

  .stat {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .stat .k {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat .v {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 700;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .keys {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 10px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }

  .keys kbd {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--ink);
    background: #1e1e2c;
    border: 1px solid var(--panel-edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    white-space: nowrap;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    background: rgba(8, 8, 13, 0.82);
    backdrop-filter: blur(3px);
    border-radius: 8px;
    padding: 20px;
  }

  .overlay[hidden] { display: none; }

  .overlay h3 {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0;
    color: var(--ink);
  }

  .overlay p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
    max-width: 220px;
    line-height: 1.6;
  }

  button.play {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bg);
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    border: none;
    border-radius: 8px;
    padding: 11px 26px;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  button.play:hover { transform: translateY(-1px); filter: brightness(1.1); }
  button.play:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .final-score {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--cyan);
    letter-spacing: 0.08em;
  }

  .touch {
    grid-column: 1 / -1;
    display: none;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .touch button {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-bottom-width: 3px;
    border-radius: 8px;
    padding: 14px 0;
    cursor: pointer;
  }
  .touch button:active { transform: translateY(1px); border-bottom-width: 1px; }

  @media (max-width: 560px) {
    .cabinet { grid-template-columns: 1fr; }
    .rail { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .rail .box { flex: 1; min-width: 130px; }
    .touch { display: grid; }
  }

  @media (prefers-reduced-motion: reduce) {
    button.play { transition: none; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <div class="brand">
    <h1>Stackfall</h1>
    <span class="tag">7-bag &middot; hold &middot; ghost</span>
  </div>

  <div class="stage">
    <canvas id="board" width="300" height="600" aria-label="Game board"></canvas>
    <div class="overlay" id="overlay">
      <h3 id="ov-title">Stackfall</h3>
      <p id="ov-text">Clear lines by filling rows. Speed climbs every ten lines. Don't touch the ceiling.</p>
      <div class="final-score" id="ov-score" hidden></div>
      <button class="play" id="startBtn">Start</button>
    </div>
  </div>

  <div class="rail">
    <div class="box">
      <h2>Next</h2>
      <canvas id="next" width="120" height="264"></canvas>
    </div>
    <div class="box">
      <h2>Hold</h2>
      <canvas id="hold" width="120" height="80"></canvas>
    </div>
    <div class="box stats">
      <div class="stat"><span class="k">Score</span><span class="v" id="score">0</span></div>
      <div class="stat"><span class="k">Lines</span><span class="v" id="lines">0</span></div>
      <div class="stat"><span class="k">Level</span><span class="v" id="level">1</span></div>
    </div>
    <div class="box">
      <h2>Controls</h2>
      <div class="keys">
        <kbd>&larr; &rarr;</kbd><span>Move</span>
        <kbd>&darr;</kbd><span>Soft drop</span>
        <kbd>Space</kbd><span>Hard drop</span>
        <kbd>&uarr; / X</kbd><span>Rotate CW</span>
        <kbd>Z</kbd><span>Rotate CCW</span>
        <kbd>C</kbd><span>Hold</span>
        <kbd>P</kbd><span>Pause</span>
      </div>
    </div>
  </div>

  <div class="touch" id="touch">
    <button data-act="left">&larr;</button>
    <button data-act="rotate">&#8635;</button>
    <button data-act="right">&rarr;</button>
    <button data-act="soft">&darr;</button>
    <button data-act="hard">DROP</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var COLS = 10, ROWS = 20, CELL = 30, HIDDEN = 2;
  var board = document.getElementById("board");
  var bctx = board.getContext("2d");
  var nctx = document.getElementById("next").getContext("2d");
  var hctx = document.getElementById("hold").getContext("2d");

  var COLORS = {
    I: getVar("--i"), O: getVar("--o"), T: getVar("--t"),
    S: getVar("--s"), Z: getVar("--z"), J: getVar("--j"), L: getVar("--l")
  };

  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var BOX = { I: 4, O: 4, T: 3, S: 3, Z: 3, J: 3, L: 3 };

  var grid, cur, holdPiece, canHold, queue, score, lines, level, dropMs, acc, last, state;
  // state: "idle" | "playing" | "paused" | "over"

  function getVar(n) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  }

  function newGrid() {
    var g = [];
    for (var r = 0; r < ROWS + HIDDEN; r++) {
      g.push(new Array(COLS).fill(null));
    }
    return g;
  }

  function refillQueue() {
    var bag = ["I", "O", "T", "S", "Z", "J", "L"];
    for (var i = bag.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = bag[i]; bag[i] = bag[j]; bag[j] = t;
    }
    queue = queue.concat(bag);
  }

  function makePiece(type) {
    return {
      type: type,
      cells: SHAPES[type].map(function (c) { return c.slice(); }),
      box: BOX[type],
      x: type === "I" || type === "O" ? 3 : 3,
      y: type === "I" ? HIDDEN - 1 : HIDDEN
    };
  }

  function spawn() {
    if (queue.length < 8) refillQueue();
    cur = makePiece(queue.shift());
    canHold = true;
    if (collides(cur, 0, 0, cur.cells)) {
      gameOver();
    }
    drawNext();
  }

  function rotated(piece, dir) {
    if (piece.type === "O") return piece.cells.map(function (c) { return c.slice(); });
    var n = piece.box - 1;
    return piece.cells.map(function (c) {
      return dir > 0 ? [n - c[1], c[0]] : [c[1], n - c[0]];
    });
  }

  function collides(piece, dx, dy, cells) {
    for (var i = 0; i < cells.length; i++) {
      var x = piece.x + cells[i][0] + dx;
      var y = piece.y + cells[i][1] + dy;
      if (x < 0 || x >= COLS || y >= ROWS + HIDDEN) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  var KICKS = [0, -1, 1, -2, 2];

  function rotate(dir) {
    if (state !== "playing") return;
    var cells = rotated(cur, dir);
    for (var k = 0; k < KICKS.length; k++) {
      if (!collides(cur, KICKS[k], 0, cells)) {
        cur.x += KICKS[k];
        cur.cells = cells;
        return;
      }
    }
  }

  function move(dx) {
    if (state !== "playing") return;
    if (!collides(cur, dx, 0, cur.cells)) cur.x += dx;
  }

  function softDrop() {
    if (state !== "playing") return;
    if (!collides(cur, 0, 1, cur.cells)) {
      cur.y++;
      score += 1;
      updateStats();
    } else {
      lockPiece();
    }
    acc = 0;
  }

  function hardDrop() {
    if (state !== "playing") return;
    var d = 0;
    while (!collides(cur, 0, d + 1, cur.cells)) d++;
    cur.y += d;
    score += d * 2;
    lockPiece();
  }

  function hold() {
    if (state !== "playing" || !canHold) return;
    var t = cur.type;
    if (holdPiece) {
      cur = makePiece(holdPiece);
    } else {
      spawn();
    }
    holdPiece = t;
    canHold = false;
    drawHold();
  }

  function lockPiece() {
    for (var i = 0; i < cur.cells.length; i++) {
      var x = cur.x + cur.cells[i][0];
      var y = cur.y + cur.cells[i][1];
      if (y >= 0) grid[y][x] = cur.type;
    }
    clearLines();
    spawn();
    acc = 0;
  }

  function clearLines() {
    var cleared = 0;
    for (var r = ROWS + HIDDEN - 1; r >= 0; r--) {
      if (grid[r].every(function (c) { return c; })) {
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared > 0) {
      var table = [0, 100, 300, 500, 800];
      score += table[cleared] * level;
      lines += cleared;
      var newLevel = Math.floor(lines / 10) + 1;
      if (newLevel > level) {
        level = newLevel;
        dropMs = Math.max(80, Math.floor(1000 * Math.pow(0.82, level - 1)));
      }
      updateStats();
    }
  }

  function updateStats() {
    document.getElementById("score").textContent = score.toLocaleString();
    document.getElementById("lines").textContent = lines;
    document.getElementById("level").textContent = level;
  }

  function ghostY() {
    var d = 0;
    while (!collides(cur, 0, d + 1, cur.cells)) d++;
    return d;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCell(ctx, cx, cy, size, color, ghost) {
    var pad = 1;
    if (ghost) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.4;
      roundRect(ctx, cx + pad + 1, cy + pad + 1, size - pad * 2 - 2, size - pad * 2 - 2, 3);
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }
    roundRect(ctx, cx + pad, cy + pad, size - pad * 2, size - pad * 2, 4);
    ctx.fillStyle = color;
    ctx.fill();
    var g = ctx.createLinearGradient(cx, cy, cx, cy + size);
    g.addColorStop(0, "rgba(255,255,255,0.28)");
    g.addColorStop(0.5, "rgba(255,255,255,0)");
    g.addColorStop(1, "rgba(0,0,0,0.25)");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function draw() {
    bctx.clearRect(0, 0, board.width, board.height);

    bctx.strokeStyle = getVar("--grid-line");
    bctx.lineWidth = 1;
    for (var c = 1; c < COLS; c++) {
      bctx.beginPath();
      bctx.moveTo(c * CELL + 0.5, 0);
      bctx.lineTo(c * CELL + 0.5, board.height);
      bctx.stroke();
    }
    for (var r = 1; r < ROWS; r++) {
      bctx.beginPath();
      bctx.moveTo(0, r * CELL + 0.5);
      bctx.lineTo(board.width, r * CELL + 0.5);
      bctx.stroke();
    }

    for (var y = HIDDEN; y < ROWS + HIDDEN; y++) {
      for (var x = 0; x < COLS; x++) {
        if (grid[y][x]) {
          drawCell(bctx, x * CELL, (y - HIDDEN) * CELL, CELL, COLORS[grid[y][x]]);
        }
      }
    }

    if (cur && (state === "playing" || state === "paused")) {
      var gy = ghostY();
      var i;
      for (i = 0; i < cur.cells.length; i++) {
        var gx = (cur.x + cur.cells[i][0]) * CELL;
        var gyy = (cur.y + cur.cells[i][1] + gy - HIDDEN) * CELL;
        if (cur.y + cur.cells[i][1] + gy >= HIDDEN) {
          drawCell(bctx, gx, gyy, CELL, COLORS[cur.type], true);
        }
      }
      for (i = 0; i < cur.cells.length; i++) {
        var px = (cur.x + cur.cells[i][0]) * CELL;
        var py = (cur.y + cur.cells[i][1] - HIDDEN) * CELL;
        if (cur.y + cur.cells[i][1] >= HIDDEN) {
          drawCell(bctx, px, py, CELL, COLORS[cur.type]);
        }
      }
    }
  }

  function drawMini(ctx, type, originY) {
    var cells = SHAPES[type];
    var minX = 4, maxX = 0, minY = 4, maxY = 0;
    cells.forEach(function (c) {
      minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]);
      minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]);
    });
    var w = (maxX - minX + 1), h = (maxY - minY + 1);
    var size = 20;
    var offX = (ctx.canvas.width - w * size) / 2 - minX * size;
    var offY = originY + (64 - h * size) / 2 - minY * size;
    cells.forEach(function (c) {
      drawCell(ctx, offX + c[0] * size, offY + c[1] * size, size, COLORS[type]);
    });
  }

  function drawNext() {
    nctx.clearRect(0, 0, nctx.canvas.width, nctx.canvas.height);
    for (var i = 0; i < 3 && i < queue.length; i++) {
      drawMini(nctx, queue[i], i * 88 + 4);
    }
  }

  function drawHold() {
    hctx.clearRect(0, 0, hctx.canvas.width, hctx.canvas.height);
    if (holdPiece) drawMini(hctx, holdPiece, 4);
  }

  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    var dt = t - last;
    last = t;
    if (state === "playing") {
      acc += dt;
      if (acc >= dropMs) {
        acc = 0;
        if (!collides(cur, 0, 1, cur.cells)) {
          cur.y++;
        } else {
          lockPiece();
        }
      }
    }
    draw();
  }

  function showOverlay(title, text, finalScore) {
    var ov = document.getElementById("overlay");
    document.getElementById("ov-title").textContent = title;
    document.getElementById("ov-text").textContent = text;
    var s = document.getElementById("ov-score");
    if (finalScore != null) {
      s.hidden = false;
      s.textContent = "Final score  " + finalScore.toLocaleString();
    } else {
      s.hidden = true;
    }
    document.getElementById("startBtn").textContent =
      state === "over" ? "Play again" : state === "paused" ? "Resume" : "Start";
    ov.hidden = false;
  }

  function hideOverlay() {
    document.getElementById("overlay").hidden = true;
  }

  function startGame() {
    grid = newGrid();
    queue = [];
    refillQueue();
    holdPiece = null;
    canHold = true;
    score = 0; lines = 0; level = 1;
    dropMs = 1000; acc = 0;
    updateStats();
    drawHold();
    spawn();
    state = "playing";
    hideOverlay();
  }

  function togglePause() {
    if (state === "playing") {
      state = "paused";
      showOverlay("Paused", "Catch your breath. Press P or Resume to continue.");
    } else if (state === "paused") {
      state = "playing";
      hideOverlay();
    }
  }

  function gameOver() {
    state = "over";
    showOverlay("Game Over", "The stack reached the top.", score);
  }

  document.getElementById("startBtn").addEventListener("click", function () {
    if (state === "paused") { togglePause(); return; }
    startGame();
  });

  document.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "p") { e.preventDefault(); togglePause(); return; }
    if (state !== "playing") {
      if (e.key === " " || k === "enter") {
        e.preventDefault();
        if (state === "idle" || state === "over") startGame();
      }
      return;
    }
    switch (e.key) {
      case "ArrowLeft": e.preventDefault(); move(-1); break;
      case "ArrowRight": e.preventDefault(); move(1); break;
      case "ArrowDown": e.preventDefault(); softDrop(); break;
      case "ArrowUp": e.preventDefault(); rotate(1); break;
      case " ": e.preventDefault(); hardDrop(); break;
      default:
        if (k === "x") rotate(1);
        else if (k === "z") rotate(-1);
        else if (k === "c") hold();
    }
  });

  var touch = document.getElementById("touch");
  touch.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    if (state !== "playing") return;
    var act = btn.dataset.act;
    if (act === "left") move(-1);
    else if (act === "right") move(1);
    else if (act === "rotate") rotate(1);
    else if (act === "soft") softDrop();
    else if (act === "hard") hardDrop();
  });

  // swipe / tap on the board for mobile
  var tStart = null;
  board.addEventListener("pointerdown", function (e) {
    tStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  board.addEventListener("pointerup", function (e) {
    if (!tStart || state !== "playing") { tStart = null; return; }
    var dx = e.clientX - tStart.x, dy = e.clientY - tStart.y;
    var adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx < 12 && ady < 12) {
      rotate(1);
    } else if (adx > ady) {
      move(dx > 0 ? 1 : -1);
    } else if (dy > 0) {
      if (dy > 60) hardDrop(); else softDrop();
    }
    tStart = null;
  });

  state = "idle";
  grid = newGrid();
  queue = [];
  refillQueue();
  drawNext();
  drawHold();
  showOverlay("Stackfall", "Clear lines by filling rows. Speed climbs every ten lines. Don't touch the ceiling.");
  requestAnimationFrame(loop);
})();
</script>
</body>
